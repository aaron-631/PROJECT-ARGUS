name: Bug report
description: Report a reproducible Argus problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private configuration, customer data, or raw model responses. See SECURITY.md.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, sanitized configuration shape, and expected versus actual behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node/npm, Argus commit, and installation method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Paste only output with credentials, URLs with tokens, and private data removed.
