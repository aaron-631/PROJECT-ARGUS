name: Argus Compatibility

on: [push, pull_request]

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check CLI and environment
        run: |
          argus --help
          argus doctor --json
      - name: Run portable quality checks
        run: |
          black --check --target-version py311 src/ tests/ argus.py runtime_gateway.py scripts
          flake8 src/ tests/ argus.py runtime_gateway.py scripts
          mypy src/
          pytest tests/ -q
          python -m src.models.schema_generation --check
          python -m pip check
