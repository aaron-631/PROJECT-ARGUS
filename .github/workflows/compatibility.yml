name: Argus Compatibility

on: [push, pull_request]

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check CLI and environment
        run: |
          argus --help
          argus doctor --json
      - name: Run portable quality checks
        run: |
          black --check --target-version py311 src/ tests/ argus.py runtime_gateway.py scripts
          flake8 src/ tests/ argus.py runtime_gateway.py scripts
          mypy src/
          pytest tests/ -q
          python -m src.models.schema_generation --check
          python -m pip check
