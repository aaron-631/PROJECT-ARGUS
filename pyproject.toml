[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "argus-framework"
version = "0.1.0"
description = "Enterprise-grade AI security evaluation framework for LLMs and autonomous agent ecosystems"
requires-python = ">=3.11"

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
