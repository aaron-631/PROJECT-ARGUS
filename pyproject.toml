[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-framework"
version = "0.1.0"
description = "Local-first security evaluation and runtime policy gateway for AI agents, MCP servers, skills, and LLM deployments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0,<3",
    "pyyaml>=6.0.1",
    "json5>=0.9.25",
    "jsonschema>=4.21.0",
]

[project.scripts]
argus = "argus:main"
argus-runtime = "runtime_gateway:main"

# Plugin packages publish into these groups; see docs/plugins.md.
# Argus itself declares no entries here — an empty table emits nothing.

[tool.setuptools]
py-modules = ["argus", "runtime_gateway"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.models" = ["*.json"]

[tool.setuptools.data-files]
"config" = ["config/default_config.yaml"]
"config/profiles" = ["config/profiles/banking_agent.yaml", "config/profiles/public_faq.yaml"]
"config/runtime" = ["config/runtime/placement_agent.yaml"]
"data/attacks" = ["data/attacks/manifest.json"]
"data/attacks/data_extraction/partial_leakage" = [
    "data/attacks/data_extraction/partial_leakage/payloads.json"
]
"data/attacks/jailbreaks/hypothetical_scenarios" = [
    "data/attacks/jailbreaks/hypothetical_scenarios/payloads.json"
]
"data/attacks/prompt_injection/direct_system_override" = [
    "data/attacks/prompt_injection/direct_system_override/payloads.json"
]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
