# Argus Default Configuration
version: "1.0"
deployment_context: human_in_loop

engine:
  max_concurrent_attacks: 10
  rate_limit_rps: 5
  timeout_seconds: 30
  max_retries: 3
  backoff_base_seconds: 0.25
  max_file_size_bytes: 1048576
  max_files: 5000
  max_total_size_bytes: 100000000
  max_http_response_bytes: 2000000

judge:
  backend: "NullJudgeBackend"  # Default: no external calls

reporting:
  formats: ["json", "markdown", "sarif"]
  output_dir: "./reports"
  fail_on: "HIGH"

vault:
  enabled: true
  vault_dir: ".vault"

# Dynamic testing is opt-in. Select a provider with CLI flags or the
# ARGUS_TARGET_* environment variables; API keys are read only from env.
target:
  provider: generic
  max_tokens: 512
  temperature: 0.0

# Empty means "every registered scanner", so a pip-installed plugin runs without
# editing this file. List explicit ids to restrict; use disabled_modules to drop one.
scanners: []
attacks: ["prompt_injection", "jailbreak", "data_extraction", "indirect_prompt_injection"]
dataset_version: "1.1.0"
