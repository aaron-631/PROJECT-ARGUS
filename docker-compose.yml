services:
  mock:
    build: .
    entrypoint: ["python", "tests/mock_server.py"]
    expose:
      - "8765"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8765), 2); s.close()"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 1s

  argus:
    build: .
    command:
      ["scan", "--target", "/app/config", "--output", "/app/reports", "--fail-on", "CRITICAL"]
    depends_on:
      mock:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./reports:/app/reports
      - ./.vault:/app/.vault
    environment:
      - ARGUS_TARGET_ENDPOINT=http://mock:8765/v1/messages

  runtime:
    build: .
    entrypoint: ["python", "runtime_gateway.py"]
    command: ["--config", "/app/config/runtime/placement_agent.yaml", "--host", "0.0.0.0"]
    depends_on:
      mock:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./runtime-audit:/app/runtime-audit
    environment:
      - ARGUS_RUNTIME_UPSTREAM_URL=http://mock:8765/v1/messages
      - ARGUS_RUNTIME_AUDIT_PATH=/app/runtime-audit/events.jsonl
